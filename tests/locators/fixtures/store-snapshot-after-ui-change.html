<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store — DOM snapshot</title>
  </head>
  <body>
    <!--
      The same snapshot as `store-snapshot.html` after a routine UI change.
      Trimmed to the
      regions the locator exercise looks at. It keeps the real markup shape:
      the Tailwind class chains, the React-generated headlessui ids, and the
      `data-testid` attributes the sandbox ships on every relevant element.

      Three things changed here, none a functional change and none a testid
      rename: the card anchor class (`group` -> `product-link`), the generated
      headlessui ids, and the sort label (`Price: Low -> High` -> German).

      Four changes, none of them a functional change and none of them a
      `data-testid` rename:
        1. the card anchor class `group` was renamed to `product-link`
        2. the React-generated headlessui ids were regenerated
        3. the sort label was localised to German
        4. a promo <li> was inserted as the FIRST child of the product grid

      The nth-child locator still finds exactly one element here — the promo,
      not a product card. That is its own lesson: a locator can match exactly
      one element and still be the wrong one. Stable `data-testid` locators
      survive all four.

      The brittle locators in `pages/store/store.page.ts` are matched against
      this file by `tests/locators/locators.spec.ts`, so the exercise runs with
      no network and gives the same answer on every machine.
    -->
    <header>
      <nav>
        <div class="flex items-center h-full">
          <div class="h-full flex" data-headlessui-state="">
            <div class="relative flex h-full">
              <button
                data-testid="nav-menu-button"
                class="relative h-full flex items-center transition-all ease-out duration-200 focus:outline-none hover:text-ui-fg-base"
                type="button"
                aria-expanded="false"
                id="headlessui-popover-button-_R_9xQ2vwplk_"
              >
                Menu
              </button>
            </div>
          </div>
        </div>
        <div class="flex items-center h-full">
          <a class="txt-compact-xlarge-plus hover:text-ui-fg-base uppercase" data-testid="nav-store-link" href="/dk">
            Medusa Store
          </a>
        </div>
        <div class="flex items-center gap-x-6 h-full flex-1 basis-0 justify-end">
          <div class="hidden small:flex items-center gap-x-6 h-full">
            <a class="hover:text-ui-fg-base" data-testid="nav-account-link" href="/dk/account">Account</a>
          </div>
          <div class="h-full z-50">
            <div class="relative h-full" data-headlessui-state="">
              <button class="h-full" type="button" aria-expanded="false" id="headlessui-popover-button-_R_4hLp8mZq1c_">
                <a class="hover:text-ui-fg-base" data-testid="nav-cart-link" href="/dk/cart">Cart (0)</a>
              </button>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <div class="flex flex-col small:flex-row small:items-start py-6 content-container" data-testid="category-container">
      <div class="flex flex-col gap-12 py-4 mb-8 small:px-0 pl-6 small:min-w-[250px] small:ml-[1.675rem]">
        <div class="flex gap-x-3 flex-col gap-y-3">
          <p class="txt-medium txt-compact-small-plus text-ui-fg-muted">Sort by</p>
          <div class="flex flex-col gap-2" data-testid="sort-by-container">
            <div class="flex gap-x-2 items-center ml-[-23px]">
              <input type="radio" id="created_at" class="h-4 w-4 hidden peer" checked value="created_at" />
              <label
                class="text-sm font-medium !txt-compact-small !transform-none text-ui-fg-subtle hover:cursor-pointer"
                for="created_at"
                data-testid="radio-label"
                data-active="true"
                >Latest Arrivals</label
              >
            </div>
            <div class="flex gap-x-2 items-center">
              <input type="radio" id="price_asc" class="h-4 w-4 hidden peer" value="price_asc" />
              <label
                class="text-sm font-medium !txt-compact-small !transform-none text-ui-fg-subtle hover:cursor-pointer"
                for="price_asc"
                data-testid="radio-label"
                data-active="false"
                >Preis: Aufsteigend</label
              >
            </div>
            <div class="flex gap-x-2 items-center">
              <input type="radio" id="price_desc" class="h-4 w-4 hidden peer" value="price_desc" />
              <label
                class="text-sm font-medium !txt-compact-small !transform-none text-ui-fg-subtle hover:cursor-pointer"
                for="price_desc"
                data-testid="radio-label"
                data-active="false"
                >Price: High -&gt; Low</label
              >
            </div>
          </div>
        </div>
      </div>

      <div class="w-full">
        <div class="flex flex-row mb-8 text-2xl-semi gap-4">
          <h1 data-testid="category-page-title">All products</h1>
        </div>
        <ul class="grid grid-cols-2 w-full small:grid-cols-3 medium:grid-cols-4 gap-x-6 gap-y-8" data-testid="products-list">
          <li class="promo-slot"><a href="/dk/promo"><span class="banner">Free shipping this week</span></a></li>
          
          <li>
            <a class="product-link" href="/dk/products/sweatshirt">
              <div data-testid="product-wrapper">
                <div
                  class="bg-white rounded-lg p-4 relative w-full overflow-hidden bg-ui-bg-subtle shadow-elevation-card-rest rounded-large aspect-[9/16] w-full"
                >
                  <img
                    src="https://example.invalid/sweatshirt.png"
                    class="absolute inset-0 h-full w-full object-cover object-center"
                    draggable="false"
                  />
                </div>
                <div class="flex txt-compact-medium mt-4 justify-between">
                  <p class="txt-medium text-ui-fg-subtle" data-testid="product-title">Medusa Sweatshirt</p>
                  <div class="flex items-center gap-x-2">
                    <p class="txt-medium text-ui-fg-muted" data-testid="price">€10.00</p>
                  </div>
                </div>
              </div>
            </a>
          </li>
          <li>
            <a class="product-link" href="/dk/products/t-shirt">
              <div data-testid="product-wrapper">
                <div
                  class="bg-white rounded-lg p-4 relative w-full overflow-hidden bg-ui-bg-subtle shadow-elevation-card-rest rounded-large aspect-[9/16] w-full"
                >
                  <img
                    src="https://example.invalid/t-shirt.png"
                    class="absolute inset-0 h-full w-full object-cover object-center"
                    draggable="false"
                  />
                </div>
                <div class="flex txt-compact-medium mt-4 justify-between">
                  <p class="txt-medium text-ui-fg-subtle" data-testid="product-title">Medusa T-Shirt</p>
                  <div class="flex items-center gap-x-2">
                    <p class="txt-medium text-ui-fg-muted" data-testid="price">€10.00</p>
                  </div>
                </div>
              </div>
            </a>
          </li>
          <li>
            <a class="product-link" href="/dk/products/sweatpants">
              <div data-testid="product-wrapper">
                <div
                  class="bg-white rounded-lg p-4 relative w-full overflow-hidden bg-ui-bg-subtle shadow-elevation-card-rest rounded-large aspect-[9/16] w-full"
                >
                  <img
                    src="https://example.invalid/sweatpants.png"
                    class="absolute inset-0 h-full w-full object-cover object-center"
                    draggable="false"
                  />
                </div>
                <div class="flex txt-compact-medium mt-4 justify-between">
                  <p class="txt-medium text-ui-fg-subtle" data-testid="product-title">Medusa Sweatpants</p>
                  <div class="flex items-center gap-x-2">
                    <p class="txt-medium text-ui-fg-muted" data-testid="price">€10.00</p>
                  </div>
                </div>
              </div>
            </a>
          </li>
          <li>
            <a class="product-link" href="/dk/products/shorts">
              <div data-testid="product-wrapper">
                <div
                  class="bg-white rounded-lg p-4 relative w-full overflow-hidden bg-ui-bg-subtle shadow-elevation-card-rest rounded-large aspect-[9/16] w-full"
                >
                  <img
                    src="https://example.invalid/shorts.png"
                    class="absolute inset-0 h-full w-full object-cover object-center"
                    draggable="false"
                  />
                </div>
                <div class="flex txt-compact-medium mt-4 justify-between">
                  <p class="txt-medium text-ui-fg-subtle" data-testid="product-title">Medusa Shorts</p>
                  <div class="flex items-center gap-x-2">
                    <p class="txt-medium text-ui-fg-muted" data-testid="price">€10.00</p>
                  </div>
                </div>
              </div>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
