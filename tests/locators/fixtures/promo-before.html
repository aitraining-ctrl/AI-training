<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Home — promo banner before the redesign</title>
  </head>
  <body>
    <!--
      The homepage promo slot, version A. One image link on the page, a stable
      `data-testid`, an English accessible name, a clean path.

      `promo-after.html` is the same slot after a redesign. The exercise is to
      locate this banner so that ONE strategy works in both files — and if none
      does, to build the self-healing chain instead.
    -->
    <main>
      <section class="hero">
        <h1>Medusa Store</h1>
        <a data-testid="promo-banner" href="/dk/promo">
          <img src="https://example.invalid/promo-summer.png" alt="Summer sale" />
        </a>
      </section>
    </main>
  </body>
</html>
